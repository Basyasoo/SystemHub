name: Publish and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release SystemHub
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} SystemHubSetup.exe --title "Release ${{ github.ref_name }}" --notes "Automated release of version ${{ github.ref_name }}"
